async function dec(pw){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},k,b(P.c)));}
function open_(h){document.open();document.write(h);document.close();}
async function go(pw,auto){
 try{const h=await dec(pw);try{localStorage.setItem('pw_v1',pw)}catch(e){}open_(h);}
 catch(e){if(!auto)document.getElementById('m').textContent=window.crypto&&crypto.subtle?'Passwort falsch':'Dieser Browser kann hier nicht entschlüsseln – bitte den https-Link nutzen';
